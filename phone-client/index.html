<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摄像头推流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: #eee;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #1a1a2e;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        header h1 { font-size: 16px; font-weight: 600; }
        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        .status.disconnected { background: #e74c3c; color: #fff; }
        .status.connecting { background: #f39c12; color: #000; }
        .status.connected { background: #2ecc71; color: #000; }

        #preview-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video, canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        canvas { position: absolute; }
        #fps-display {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 5;
        }

        .controls {
            background: #1a1a2e;
            padding: 10px 14px;
        }
        .config-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .config-row label {
            font-size: 12px;
            white-space: nowrap;
            min-width: 55px;
        }
        .config-row input, .config-row select {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #eee;
            font-size: 13px;
        }
        .hint {
            font-size: 10px;
            color: #666;
            margin-top: -4px;
            margin-bottom: 8px;
            padding-left: 63px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 6px;
        }
        #btn-start {
            background: #2ecc71;
            color: #000;
        }
        #btn-start:active { background: #1e8449; }
        #btn-start:disabled { background: #444; color: #888; }
        #btn-stop {
            background: #e74c3c;
            color: #fff;
            display: none;
        }
        #btn-permission {
            background: #3498db;
            color: #fff;
            display: none;
        }
        .info-row {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #888;
        }
        .warn {
            background: rgba(243,156,18,0.15);
            border: 1px solid #f39c12;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            color: #f39c12;
            margin-bottom: 8px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <header>
        <h1>摄像头推流</h1>
        <span id="status" class="status disconnected">未连接</span>
    </header>

    <div id="preview-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <span id="fps-display">0 FPS</span>
    </div>

    <div class="controls">
        <div class="warn" id="warn-msg"></div>

        <div class="config-row">
            <label for="server-addr">服务器</label>
            <input id="server-addr" type="text" placeholder="frp-act.com:33256" inputmode="url" autocomplete="off">
        </div>
        <div class="hint">页面地址和推流地址共用一个端口，通常已自动填入</div>

        <div class="config-row">
            <label for="camera-select">摄像头</label>
            <select id="camera-select"><option value="">请先授权摄像头</option></select>
        </div>
        <div class="config-row">
            <label for="quality">画质</label>
            <select id="quality">
                <option value="0.7">高 (0.7)</option>
                <option value="0.5" selected>中 (0.5)</option>
                <option value="0.3">低 (0.3)</option>
            </select>
        </div>

        <button id="btn-permission">授予摄像头权限</button>
        <button id="btn-start" disabled>请先授予摄像头权限</button>
        <button id="btn-stop">停止推流</button>
        <div class="info-row">
            <span>分辨率: <span id="info-res">-</span></span>
            <span>已发送: <span id="info-sent">0</span> 帧</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps-display');
        const statusEl = document.getElementById('status');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnPerm = document.getElementById('btn-permission');
        const serverAddr = document.getElementById('server-addr');
        const cameraSelect = document.getElementById('camera-select');
        const qualitySelect = document.getElementById('quality');
        const infoRes = document.getElementById('info-res');
        const infoSent = document.getElementById('info-sent');
        const warnMsg = document.getElementById('warn-msg');

        let ws = null;
        let stream = null;
        let streaming = false;
        let frameTimer = null;
        let frameSent = 0;
        let fpsFrames = 0;
        let lastFpsTime = performance.now();
        let hasPermission = false;

        // 自动填充服务器地址
        function autoFillServer() {
            const saved = localStorage.getItem('ws_server_addr');
            if (saved) { serverAddr.value = saved; return; }

            // 从当前页面 URL 推断（页面和 WebSocket 用同一端口）
            const host = window.location.hostname;
            const port = window.location.port || '__SERVER_PORT__';
            if (host && host !== 'localhost' && host !== '127.0.0.1') {
                serverAddr.value = host + ':' + port;
            }
        }
        autoFillServer();

        // 协议：从当前页面判断（frp 外部用 HTTPS，本地可能用 HTTP）
        function getWSUrl() {
            const addr = serverAddr.value.trim();
            if (!addr) return '';
            const proto = window.location.protocol === 'https:' || '__USE_TLS__' === 'true' ? 'wss' : 'ws';
            return `${proto}://${addr}`;
        }

        // ── 摄像头权限 ──

        async function requestCameraPermission() {
            warnMsg.style.display = 'none';
            try {
                const testStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'environment' },
                    audio: false,
                });
                testStream.getTracks().forEach(t => t.stop());
                hasPermission = true;
                btnPerm.style.display = 'none';
                btnStart.disabled = false;
                btnStart.textContent = '开始推流';
                await loadCameras();
            } catch (e) {
                console.error('摄像头权限:', e);
                hasPermission = false;
                btnStart.disabled = true;
                btnStart.textContent = '请先授予摄像头权限';
                btnPerm.style.display = 'block';

                const msgs = {
                    NotAllowedError: '摄像头权限被拒绝。请在浏览器设置中允许摄像头访问后点击「授予摄像头权限」。',
                    NotFoundError: '未检测到摄像头设备。',
                    NotReadableError: '摄像头被其他应用占用，请关闭其他使用摄像头的应用。',
                    OverconstrainedError: '摄像头不支持所需参数，请尝试切换摄像头。',
                };
                warnMsg.textContent = msgs[e.name] || ('摄像头错误: ' + e.message);
                warnMsg.style.display = 'block';
            }
        }

        async function loadCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                cameraSelect.innerHTML = '';
                if (videoDevices.length === 0) {
                    cameraSelect.innerHTML = '<option value="">未检测到摄像头</option>';
                    return;
                }
                videoDevices.forEach((d, i) => {
                    let label = d.label || `摄像头 ${i + 1}`;
                    if (!d.label && i === 0) label = '后置摄像头 (默认)';
                    if (!d.label && i === 1) label = '前置摄像头';
                    cameraSelect.innerHTML += `<option value="${d.deviceId}">${label}</option>`;
                });
                cameraSelect.selectedIndex = 0;
            } catch (e) {
                cameraSelect.innerHTML = '<option value="">获取摄像头列表失败</option>';
            }
        }

        btnPerm.addEventListener('click', requestCameraPermission);
        requestCameraPermission();

        navigator.mediaDevices?.addEventListener('devicechange', () => {
            if (hasPermission) loadCameras();
        });

        // ── 摄像头启停 ──

        async function startCamera() {
            if (stream) stopCamera();
            const deviceId = cameraSelect.value;
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 640 }, height: { ideal: 480 },
                    ...(deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' }),
                },
                audio: false,
            });
            video.srcObject = stream;
            await video.play();

            const s = stream.getVideoTracks()[0].getSettings();
            infoRes.textContent = `${s.width}x${s.height}`;
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            video.srcObject = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fpsDisplay.textContent = '0 FPS';
            infoRes.textContent = '-';
        }

        // ── WebSocket ──

        function connectWS() {
            const addr = serverAddr.value.trim();
            if (!addr) { showWarn('请输入服务器地址（如 frp-act.com:33256）'); return; }
            localStorage.setItem('ws_server_addr', addr);

            const url = getWSUrl();
            if (!url) return;

            setStatus('connecting', '连接中...');
            warnMsg.style.display = 'none';

            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                setStatus('connected', '已连接');
                startStreaming();
            };

            ws.onclose = () => {
                setStatus('disconnected', '未连接');
                stopStreaming();
            };

            ws.onerror = () => {
                const port = addr.split(':')[1] || '?';
                showWarn(
                    '无法连接到 ' + addr + '<br><br>' +
                    '请确认：<br>' +
                    '1. 笔记本服务器正在运行<br>' +
                    '2. 内网穿透隧道已启动，且映射到本地端口 ' + ('__SERVER_PORT__' || '8765') + '<br>' +
                    '3. 手机网络可以访问 ' + addr
                );
                disconnectWS();
            };
        }

        function disconnectWS() {
            if (ws) { ws.onclose = null; ws.onerror = null; ws.close(); ws = null; }
            setStatus('disconnected', '未连接');
        }

        function setStatus(state, text) {
            statusEl.textContent = text;
            statusEl.className = `status ${state}`;
        }

        function showWarn(msg) {
            warnMsg.innerHTML = msg;
            warnMsg.style.display = 'block';
        }

        // ── 推流循环 ──

        async function startStreaming() {
            if (streaming) return;
            try { await startCamera(); } catch (e) {
                showWarn('摄像头启动失败: ' + e.message);
                disconnectWS(); return;
            }
            streaming = true;
            btnStart.style.display = 'none';
            btnStop.style.display = 'block';
            btnPerm.style.display = 'none';
            serverAddr.disabled = true;
            cameraSelect.disabled = true;
            qualitySelect.disabled = true;
            frameSent = 0; fpsFrames = 0; lastFpsTime = performance.now();
            infoSent.textContent = '0';
            captureAndSend();
        }

        function stopStreaming() {
            streaming = false;
            if (frameTimer) cancelAnimationFrame(frameTimer);
            btnStart.style.display = 'block';
            btnStop.style.display = 'none';
            if (!hasPermission) btnPerm.style.display = 'block';
            btnStart.disabled = !hasPermission;
            serverAddr.disabled = false;
            cameraSelect.disabled = false;
            qualitySelect.disabled = false;
            stopCamera();
        }

        function captureAndSend() {
            if (!streaming) return;
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                const vw = video.videoWidth, vh = video.videoHeight;
                if (vw && vh && (canvas.width !== vw || canvas.height !== vh)) {
                    canvas.width = vw; canvas.height = vh;
                }
                if (vw && vh) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const quality = parseFloat(qualitySelect.value);
                    canvas.toBlob(blob => {
                        if (blob && ws && ws.readyState === WebSocket.OPEN) {
                            blob.arrayBuffer().then(buf => {
                                ws.send(buf);
                                frameSent++;
                                infoSent.textContent = frameSent;
                                fpsFrames++;
                                const now = performance.now();
                                if (now - lastFpsTime >= 1000) {
                                    fpsDisplay.textContent = `${Math.round(fpsFrames / ((now - lastFpsTime) / 1000))} FPS`;
                                    fpsFrames = 0; lastFpsTime = now;
                                }
                            });
                        }
                    }, 'image/jpeg', quality);
                }
            }
            frameTimer = requestAnimationFrame(captureAndSend);
        }

        // ── 按钮 ──

        btnStart.addEventListener('click', () => {
            if (!hasPermission) { requestCameraPermission(); return; }
            if (!serverAddr.value.trim()) { showWarn('请输入服务器地址'); return; }
            connectWS();
        });

        btnStop.addEventListener('click', () => { disconnectWS(); stopStreaming(); });

        window.addEventListener('beforeunload', () => { disconnectWS(); stopCamera(); });
    </script>
</body>
</html>
